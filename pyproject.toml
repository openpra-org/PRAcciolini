[project]
name = "pracciolini"
description = "Conversion utility for probabilistic risk assessment (PRA) models"
version = "0.0.1"
readme.content-type = "text/markdown"
readme.file = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Arjun Earthperson", email = "mail@earthperson.org" },
    { name = "Egemen Aras", email = "emaras@ncsu.edu" },
    { name = "Kirill Shumilov", email = "kshumil@ncsu.edu" }
]
license = {file = "LICENSE"}
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed"
]
dependencies = [
    "antlr4-python3-runtime",
    "argparse",
    "flatbuffers >=24",
    "h5py",
    "jsonschema",
    "lxml>=6.0.0",
    "networkx",
    "pandas",
    "pandas-stubs==2.3.0.250703",
    "tensorflow-probability", # needed by tensorflow-probability
    "tensorflow>=2.19.0 ; sys_platform == 'linux'",
    "tf-keras",
    "typer>=0.16.0",
]

[project.urls]
Repository = "https://github.com/openpra-org/PRAcciolini"
Documentation = "https://docs.openpra.org"
Tracker = "https://youtrack.openpra.org"
Homepage = "https://openpra.org"

[project.optional-dependencies]
default = []
cuda = [
    "tensorflow[and-cuda]",
]
dev = [
    "antlr4-tools",
    "autopep8",
    "build",
    "pyarrow",
    "pytest-xdist",
    "pytest",
    "pytest-cov",
    "pylint",
    "pylint[spelling]",
    "ruff",
    "tensorboard",
    "tensorboard_plugin_profile",
    "etils",
    "twine"
]
static-analysis = [
    "antlr4-tools",
    "autopep8",
    "ruff"
]
test = [
    "pytest-xdist",
    "pytest",
    "pytest-cov",
    "ruff"
]

[project.scripts]
pracciolini = "pracciolini.cli:app"

[tool.pytest.ini_options]
addopts = "-ra -v --strict-markers"
testpaths = [
    "tests"
]

[tool.setuptools]
packages = ["pracciolini"]

[dependency-groups]
dev = [
    "antlr4-tools>=0.2.2",
    "ipython>=9.4.0",
]

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

